<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADAPT Icon Finder — Build sequence</title><style>body{margin:0;padding:32px;background:#0c0c0c;color:#d7e2ea;font:16px system-ui,sans-serif}figure{margin:0;padding:24px;background:#151818;border:1px solid #39403e;border-radius:8px}.canvas{overflow-x:auto}svg{display:block;min-width:1120px;width:100%;font-family:system-ui,sans-serif}figcaption{font-size:13px;color:#aab8bf;margin-top:20px}</style></head><body><figure><h1>From library to Figma plugin</h1><div class="canvas"><svg viewBox="0 0 1120 220" role="img" aria-labelledby="adapt-build-title adapt-build-desc"><title id="adapt-build-title">From the ADAPT website to an internal Figma plugin</title><desc id="adapt-build-desc">I sourced the GitHub-hosted icons, prepared a local library, directed Cursor’s MVP build, refined and verified with Figma Agent, then published internally.</desc><line x1="24" y1="100" x2="920" y2="100" stroke="#819097"></line><g><line x1="24" y1="52" x2="24" y2="100" stroke="#819097"></line><circle cx="24" cy="100" r="4" fill="#d7e2ea"></circle><text x="36" y="40" fill="#d7e2ea" font-size="19" font-weight="500">ADAPT website</text><text x="36" y="64" fill="#aab8bf" font-size="13">GitHub-hosted source</text></g><g><line x1="248" y1="100" x2="248" y2="148" stroke="#819097"></line><circle cx="248" cy="100" r="4" fill="#d7e2ea"></circle><text x="260" y="172" fill="#d7e2ea" font-size="19" font-weight="500">Local library</text><text x="260" y="196" fill="#aab8bf" font-size="13">Scrape + prepare</text></g><g><line x1="472" y1="52" x2="472" y2="100" stroke="#819097"></line><circle cx="472" cy="100" r="4" fill="#d7e2ea"></circle><text x="484" y="40" fill="#d7e2ea" font-size="19" font-weight="500">Cursor MVP</text><text x="484" y="64" fill="#aab8bf" font-size="13">Screenshot + brief</text></g><g><line x1="696" y1="100" x2="696" y2="148" stroke="#819097"></line><circle cx="696" cy="100" r="4" fill="#d7e2ea"></circle><text x="708" y="172" fill="#d7e2ea" font-size="19" font-weight="500">Refine + verify</text><text x="708" y="196" fill="#aab8bf" font-size="13">My UI + Figma Agent</text></g><g><line x1="920" y1="52" x2="920" y2="100" stroke="#819097"></line><circle cx="920" cy="100" r="6" fill="#ffbf69"></circle><text x="932" y="40" fill="#ffbf69" font-size="19" font-weight="500">Internal release</text><text x="932" y="64" fill="#aab8bf" font-size="13">Organization directory</text></g></svg></div><figcaption>Build sequence only; no elapsed time between stages is implied. The initial MVP took two working days. Cursor generated the MVP from my requirements; I refined the interface and verified it with Figma Agent before internal publication.</figcaption></figure></body></html>
