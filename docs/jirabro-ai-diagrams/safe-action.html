fill="#aab8bf" font-size="13">relevant state + request</text></g><g><rect x="720" y="104" width="240" height="96" rx="6" fill="#151818" stroke="#67777e"></rect><text x="736" y="138" fill="#d7e2ea" font-size="18" font-weight="500">Selected model</text><text x="736" y="164" fill="#aab8bf" font-size="13">local or configured cloud</text></g><g><rect x="1000" y="104" width="248" height="96" rx="6" fill="#151818" stroke="#67777e"></rect><text x="1016" y="138" fill="#d7e2ea" font-size="18" font-weight="500">JSON + schema</text><text x="1016" y="164" fill="#aab8bf" font-size="13">parse or clarify</text></g><g><rect x="1000" y="280" width="248" height="96" rx="6" fill="#151818" stroke="#67777e"></rect><text x="1016" y="314" fill="#d7e2ea" font-size="18" font-weight="500">Normalize + resolve</text><text x="1016" y="340" fill="#aab8bf" font-size="13">issue · date · duration</text></g><g><rect x="720" y="280" width="240" height="96" rx="6" fill="#151818" stroke="#67777e"></rect><text x="736" y="314" fill="#d7e2ea" font-size="18" font-weight="500">Deterministic validation</text><text x="736" y="340" fill="#aab8bf" font-size="13">check required details</text></g><g><rect x="368" y="456" width="240" height="96" rx="6" fill="#192b28" stroke="#83e0cf"></rect><text x="384" y="490" fill="#83e0cf" font-size="18" font-weight="500">Review + confirm</text><text x="384" y="516" fill="#aab8bf" font-size="13">human approval for writes</text></g><g><rect x="720" y="456" width="240" height="96" rx="6" fill="#151818" stroke="#67777e"></rect><text x="736" y="490" fill="#d7e2ea" font-size="18" font-weight="500">Jira API + result</text><text x="736" y="516" fill="#aab8bf" font-size="13">actual success or error</text></g><text x="764" y="433" fill="#aab8bf" font-size="13">Missing detail → clarify</text><text x="368" y="611" fill="#aab8bf" font-size="13">Cancel → discard draft</text><text x="976" y="508" fill="#aab8bf" font-size="13">API outcome decides result</text></svg></div><figcaption id="jbai-action-caption">The confirmation branch shown is for conversational writes. Read-only actions can return without a draft; cancellation discards a pending write.</figcaption></figure></html>
