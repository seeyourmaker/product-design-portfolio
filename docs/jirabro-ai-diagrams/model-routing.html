<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conditional model routing — JiraBro</title><style>body{margin:0;background:#0c0c0c;color:#d7e2ea;font:16px system-ui,sans-serif;padding:32px}.figure{max-width:1320px;margin:auto;border:1px solid #36423e;background:#151818;padding:24px;border-radius:10px}.top{display:flex;justify-content:space-between;color:#83e0cf;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.canvas{overflow-x:auto;margin-top:20px}svg{display:block;min-width:1200px;width:100%;font-family:system-ui,sans-serif}figcaption{border-top:1px solid #36423e;margin-top:18px;padding-top:16px;color:#aab8bf;font-size:13px;line-height:1.6}</style><figure class="figure"><div class="jbai-top"><span>01 / MODEL ROUTING</span><span>Conditional paths · conceptual architecture</span></div><div class="canvas"><svg viewBox="0 0 1200 520" role="img" aria-labelledby="jbai-routing-title jbai-routing-desc"><title id="jbai-routing-title">How JiraBro routes a request to an intent extractor</title><desc id="jbai-routing-desc">Strict commands bypass models. Other requests use the configured provider mode. Auto mode can try a reachable local Ollama fast model, escalate to a stronger local model on poor extraction, and then try configured cloud providers. The output is a structured intent for validation.</desc><defs><marker id="jbai-routing-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#aab8bf" stroke-width="1.3"></path></marker></defs><path d="M176 136 H212" fill="none" stroke="#aab8bf" stroke-width="1.5" marker-end="url(#jbai-routing-arrow)"></path><path d="M392 136 H436" fill="none" stroke="#aab8bf" stroke-width="1.5" marker-end="url(#jbai-routing-arrow)"></path><path d="M304 176 V340" fill="none" stroke="#aab8bf" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#jbai-routing-arrow)"></path><path d="M616 128 H636 Q644 128 644 120 V80 Q644 72 652 72 H660" fill="none" stroke="#aab8bf" stroke-width="1.5" marker-end="url(#jbai-routing-arrow)"></path><path d="M616 144 H628 Q636 144 636 152 V256 Q636 264 644 264 H940" fill="none" stroke="#aab8bf" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#jbai-routing-arrow)"></path><path d="M904 72 H940" fill="none" stroke="#aab8bf" stroke-width="1.5" marker-end="url(#jbai-routing-arrow)"></path><path d="M1056 112 V220" fill="none" stroke="#aab8bf" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#jbai-routing-arrow)"></path><path d="M1168 72 H1176 Q1184 72 1184 80 V432 Q1184 440 1176 440 H1172" fill="none" stroke="#aab8bf" stroke-width="1.5" marker-end="url(#jbai-routing-arrow)"></path><path d="M1056 304 V396" fill="none" stroke="#aab8bf" stroke-width="1.5" marker-end="url(#jbai-routing-arrow)"></path><g><rect x="24" y="96" width="152" height="80" rx="6" fill="#151818" stroke="#67777e"></rect><text x="40" y="130" fill="#d7e2ea" font-size="18" font-weight="500">Request</text><text x="40" y="156" fill="#aab8bf" font-size="13">text or command</text></g><g><rect x="216" y="96" width="176" height="80" rx="6" fill="#151818" stroke="#67777e"></rect><text x="232" y="130" fill="#d7e2ea" font-size="18" font-weight="500">Strict resolver</text><text x="232" y="156" fill="#aab8bf" font-size="13">known command?</text></g><g><rect x="440" y="96" width="176" height="80" rx="6" fill="#151818" stroke="#67777e"></rect><text x="456" y="130" fill="#d7e2ea" font-size="18" font-weight="500">Provider mode</text><text x="456" y="156" fill="#aab8bf" font-size="13">auto / local / cloud</text></g><g><rect x="664" y="32" width="240" height="80" rx="6" fill="#151818" stroke="#67777e"></rect><text x="680" y="66" fill="#d7e2ea" font-size="18" font-weight="500">Local Ollama cascade</text><text x="680" y="92" fill="#aab8bf" font-size="13">fast → strong if needed</text></g><g><rect x="944" y="32" width="224" height="80" rx="6" fill="#192b28" stroke="#83e0cf"></rect><text x="960" y="66" fill="#83e0cf" font-size="18" font-weight="500">Quality check</text><text x="960" y="92" fill="#aab8bf" font-size="13">parse · slots · clarify</text></g><g><rect x="944" y="224" width="224" height="80" rx="6" fill="#151818" stroke="#67777e"></rect><text x="960" y="258" fill="#d7e2ea" font-size="18" font-weight="500">Cloud chain</text><text x="960" y="284" fill="#aab8bf" font-size="13">configured providers only</text></g><g><rect x="944" y="400" width="224" height="80" rx="6" fill="#151818" stroke="#67777e"></rect><text x="960" y="434" fill="#d7e2ea" font-size="18" font-weight="500">Structured intent</text><text x="960" y="460" fill="#aab8bf" font-size="13">ready for validation</text></g><g><rect x="216" y="344" width="176" height="80" rx="6" fill="#151818" stroke="#67777e"></rect><text x="232" y="378" fill="#d7e2ea" font-size="18" font-weight="500">Direct command</text><text x="232" y="404" fill="#aab8bf" font-size="13">model bypass</text></g><text x="24" y="505" fill="#aab8bf" font-size="14">Auto: local only when preferred, reachable and available · cloud only when configured</text></svg></div><figcaption id="jbai-routing-caption">The local branch is conditional; Gemini, OpenAI and Anthropic are configured cloud options. A strict command does not enter this model path.</figcaption></figure></html>
